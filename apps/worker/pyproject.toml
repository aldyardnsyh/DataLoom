[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "dataloom-worker"
version = "0.1.0"
description = "DataLoom worker: Redis Streams consumer, Medallion (Bronze/Silver/Gold), DAG runner, reconciler."
requires-python = ">=3.11,<3.12"

# EXACT PINS. Nothing installed in this session. Verify on staging (UV-14).
dependencies = [
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "sqlalchemy[asyncio]==2.0.43",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.9",
    "redis==5.4.1",
    "polars==1.34.0",
    "pyarrow==21.0.0",
    "duckdb==1.4.1",
    "boto3==1.39.10",
    "httpx==0.28.1",
    "orjson==3.13.0",
    "prometheus-client==0.23.0",
    "greenlet==3.2.4",
    "dataloom-contracts",
]

[tool.uv.sources]
dataloom-contracts = { path = "../../packages/contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
