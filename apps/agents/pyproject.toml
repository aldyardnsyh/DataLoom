[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "dataloom-agents"
version = "0.1.0"
description = "DataLoom agent worker: LangGraph graphs for Schema Profiler, Pipeline Builder, Guardian, Text-to-SQL, Self-Healing."
requires-python = ">=3.11,<3.12"

# EXACT PINS. Nothing installed in this session. Verify on staging (UV-14).
dependencies = [
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "langgraph==0.6.7",
    "langgraph-checkpoint-postgres==2.0.25",
    "langchain-core==0.3.76",
    "psycopg[binary,pool]==3.2.9",
    "httpx==0.28.1",
    "sqlglot==27.5.0",
    "duckdb==1.4.1",
    "polars==1.34.0",
    "orjson==3.13.0",
    "prometheus-client==0.23.0",
    "dataloom-contracts",
]

[tool.uv.sources]
dataloom-contracts = { path = "../../packages/contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
