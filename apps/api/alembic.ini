# Alembic configuration for DataLoom API.
# The database URL is NOT stored here: env.py reads DATALOOM_DATABASE_URL from
# the environment (or from .env via pydantic-settings) so secrets never live in
# the repository (see docs/SECURITY / ADR-004).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Use a timestamp-based revision id for every FUTURE migration; the initial one
# is pinned as "0001" on purpose so it is easy to reference in docs.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Truncate the alembic_version.version_num column semantics remain default.
timezone = UTC

[post_write_hooks]
# Hooks intentionally left empty. Run formatters separately if needed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
