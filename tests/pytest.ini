; DataLoom test runner configuration.
;
; HOW TO RUN (nothing has been run yet — see tests/README.md):
;     cd apps/api && pytest ../../tests
;
; This file exists so the suite behaves identically even when pytest is invoked
; from the repository root (``pytest tests``) instead of ``apps/api``.
; ``apps/api/pyproject.toml`` already sets ``testpaths = ["../../tests"]`` and
; ``asyncio_mode = "auto"``; the same values are repeated here so the two
; entry points cannot drift.
[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
; No network. A test that needs the network is a test that cannot be trusted
; to be deterministic; the suite must fail loudly if that changes.
addopts =
    -q
    -p no:cacheprovider
    --strict-markers
    --import-mode=prepend
; A hung test is a bug in the fake, not a reason to wait forever.
timeout = 120
filterwarnings =
    error::DeprecationWarning:app.*
markers =
    slow: test would take more than a second on real hardware (none today)
    runtime_required: assertion only meaningful on real Postgres/Redis (none today)
    unit: pure logic, no I/O
    integration: API behaviour driven through the FastAPI app with fakes
    tenant: cross-tenant isolation (FR-003, NFR-07)
    recovery: restart resilience (FR-037, NFR-08)
    agents: agent contracts, guards and evaluation harness
