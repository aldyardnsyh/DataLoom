[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "dataloom-contracts"
version = "0.1.0"
description = "DataLoom typed contracts: Pydantic v2 models for API shapes, DAG and agent outputs. Single source of truth."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "DataLoom" }]
keywords = ["dataloom", "contracts", "pydantic", "pipeline", "dag"]

# Exact pins for reproducible installs on CPython 3.11.
dependencies = [
    "pydantic==2.12.5",
]

[project.optional-dependencies]
# Used only by openapi_export.py when a caller wants to dump the schema as JSON
# with orjson instead of the stdlib encoder.
export = ["orjson==3.13.0"]

[tool.hatch.build.targets.wheel]
packages = ["dataloom_contracts"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
